<!DOCTYPE html>
<html>
<head>
    <title>TD Learning 教学实验室 (最终修正版)</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
    
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #2c3e50; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .editor-section { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #ddd; }
        .CodeMirror { flex: 1; font-size: 14px; }
        .viz-section { width: 420px; display: flex; flex-direction: column; padding: 15px; background: #fff; overflow-y: auto; }
        canvas { border: 2px solid #333; align-self: center; background: #fff; cursor: pointer; }
        #terminal { margin-top: 15px; background: #1e1e1e; color: #d4d4d4; padding: 10px; font-family: 'Consolas', monospace; font-size: 12px; height: 180px; overflow-y: auto; border-radius: 4px; border: 1px solid #444; white-space: pre-wrap; }
        .term-out { color: #2ecc71; }
        .term-err { color: #e74c3c; }
        .controls { width: 100%; margin-top: 15px; }
        button { width: 100%; padding: 10px; margin-bottom: 5px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        #runBtn { background: #27ae60; color: white; }
        #runBtn:disabled { background: #95a5a6; }
        #status { font-size: 13px; color: #666; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 1.1em;">TD Learning 实验室 (Async 可控速版)</div>
    <div id="status">正在加载 Python 运行环境...</div>
</header>

<div class="main-container">
    <div class="editor-section">
        <textarea id="codeEditor">import numpy as np
import random
import asyncio

# 使用 async 定义异步训练函数
async def solve_td(grid_array, rows, cols, update_ui):
    # ==========================================
    # 可调节参数区
    # ==========================================
    episodes = 500       # 总训练轮数
    render_interval = 5  # 每隔多少轮刷新一次画面
    sleep_ms = 50        # 刷新时的停顿时间 (毫秒)，现在调大将会有明显的减速效果
    
    gamma = 0.9          # 折扣因子
    alpha = 0.1          # 学习率
    epsilon = 0.1        # 探索率
    # ==========================================

    print(f"开始训练: 计划执行 {episodes} 轮...")
    actions = [(0, 1), (0, -1), (1, 0), (-1, 0)]
    q_table = np.zeros((rows, cols, 4))

    for i in range(episodes):
        # 实时可视化更新
        if i % render_interval == 0:
            current_policy = np.argmax(q_table, axis=2).tolist()
            # 使用 await 强制 Python 等待浏览器渲染和延迟
            await update_ui(current_policy, i, sleep_ms) 
            
        starts = np.argwhere(grid_array == 0)
        if len(starts) == 0: break
        curr_s = tuple(random.choice(starts))
        
        for _ in range(50):
            # epsilon-greedy 动作选择
            if random.random() < epsilon:
                curr_a = random.randint(0, 3)
            else:
                curr_a = np.argmax(q_table[curr_s[0], curr_s[1]])
            
            r_idx, c_idx = curr_s
            dr, dc = actions[curr_a]
            next_s = (r_idx + dr, c_idx + dc)
            
            is_terminal = False
            if not (0 <= next_s[0] < rows and 0 <= next_s[1] < cols) or grid_array[next_s[0], next_s[1]] == 1:
                reward = -10
                is_terminal = True
            elif grid_array[next_s[0], next_s[1]] == 2:
                reward = 100
                is_terminal = True
            else:
                reward = -1
            
            # TD 更新公式
            if is_terminal:
                td_target = reward
            else:
                best_next_a = np.argmax(q_table[next_s[0], next_s[1]])
                td_target = reward + gamma * q_table[next_s[0], next_s[1], best_next_a]
            
            # 更新 Q 表
            q_table[curr_s[0], curr_s[1], curr_a] += alpha * (td_target - q_table[curr_s[0], curr_s[1], curr_a])
            
            if is_terminal: break
            curr_s = next_s

    print("训练结束。")
    return np.argmax(q_table, axis=2).tolist()
</textarea>
    </div>

    <div class="viz-section">
        <canvas id="gridCanvas" width="350" height="350"></canvas>
        <div class="controls">
            <button id="runBtn" disabled onclick="executePython()">开始训练 (Async)</button>
            <button onclick="resetGrid()" style="background:#e67e22; color:white;">清空地图</button>
            <button onclick="clearTerminal()" style="background:#7f8c8d; color:white;">清空终端</button>
        </div>
        <div id="terminal"></div>
    </div>
</div>

<script>
    let pyodide;
    const terminal = document.getElementById('terminal');
    const canvas = document.getElementById('gridCanvas');
    const ctx = canvas.getContext('2d');
    const rows = 10, cols = 10, size = 35;
    let grid = Array(rows).fill().map(() => Array(cols).fill(0));

    const editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
        mode: "python", theme: "dracula", lineNumbers: true, indentUnit: 4,
    });

    function addToTerminal(msg, type = 'out') {
        const span = document.createElement('div');
        span.className = type === 'err' ? 'term-err' : 'term-out';
        span.textContent = msg;
        terminal.appendChild(span);
        terminal.scrollTop = terminal.scrollHeight;
    }

    function clearTerminal() { terminal.innerHTML = ''; }

    function draw(policy = null) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const arrows = ['→', '←', '↓', '↑'];
        for(let r=0; r<rows; r++) {
            for(let c=0; c<cols; c++) {
                if(grid[r][c] === 1) ctx.fillStyle = '#333';
                else if(grid[r][c] === 2) ctx.fillStyle = '#ff4d4d';
                else ctx.fillStyle = '#fff';
                ctx.fillRect(c*size, r*size, size, size);
                ctx.strokeStyle = '#ddd';
                ctx.strokeRect(c*size, r*size, size, size);
                if(policy && grid[r][c] === 0) {
                    ctx.fillStyle = "#3498db";
                    ctx.font = "bold 16px Arial";
                    // 处理 Pyodide Proxy 对象的取值
                    const val = typeof policy.get === 'function' ? policy.get(r).get(c) : policy[r][c];
                    ctx.fillText(arrows[val], c*size + 12, r*size + 24);
                }
            }
        }
    }

    // 异步 UI 更新函数
    async function updateUIFromPython(policy, episode, ms) {
        draw(policy);
        if (episode % 50 === 0) {
            addToTerminal(`训练中: Episode ${episode}`);
        }
        // 关键：通过 await 制造真实的非阻塞延迟
        await new Promise(resolve => setTimeout(resolve, ms)); 
    }

    canvas.onclick = (e) => {
        const r = Math.floor(e.offsetY / size);
        const c = Math.floor(e.offsetX / size);
        if (r < rows && c < cols) {
            grid[r][c] = (grid[r][c] + 1) % 3;
            draw();
        }
    };

    function resetGrid() {
        grid = Array(rows).fill().map(() => Array(cols).fill(0));
        draw();
    }

    async function initPy() {
        try {
            pyodide = await loadPyodide();
            await pyodide.loadPackage("numpy");
            pyodide.setStdout({ batched: (str) => addToTerminal(str) });
            document.getElementById('status').innerText = "● Python (WASM) 就绪";
            document.getElementById('status').style.color = "#2ecc71";
            document.getElementById('runBtn').disabled = false;
        } catch (e) {
            addToTerminal("加载失败", 'err');
        }
    }

    async function executePython() {
        const btn = document.getElementById('runBtn');
        btn.disabled = true;
        clearTerminal();
        try {
            const userCode = editor.getValue();
            pyodide.globals.set("js_grid", grid);
            pyodide.globals.set("js_update_ui", updateUIFromPython);
            
            // 使用 await 调用异步 Python 函数
            const fullCode = `
import numpy as np
import asyncio
${userCode}
grid_data = np.array(js_grid.to_py())
await solve_td(grid_data, ${rows}, ${cols}, js_update_ui)
`;
            const result = await pyodide.runPythonAsync(fullCode);
            if (result) draw(result);
        } catch (err) {
            addToTerminal("Error: " + err.message, 'err');
        } finally {
            btn.disabled = false;
        }
    }
    initPy();
    draw();
</script>
</body>
</html>
